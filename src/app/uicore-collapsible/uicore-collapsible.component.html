<div>
  <div class="text-right">
    <a href="javascript:void(0);" (click)="toggleCollapse()">
      <span>
        {{ isCollapsedInput() ? collapsedButtonText() : uncollapsedButtonText() }}
      </span>
    </a>
  </div>

  <div class="content-container" [ngClass]="{ warning: warning(), collapsed: isCollapsedInput() }">
    <div [hidden]="isCollapsedInput()">
      <ng-content></ng-content>

      @if (showChangeButton()) {
        <div class="text-right">
          <a href="javascript:void(0);" id="btn-collapsible-change" (click)="change()">
            <span>
              {{ changeButtonText() }}
            </span>
          </a>
        </div>
      }
    </div>
  </div>
</div>
