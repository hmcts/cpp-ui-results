<back-button [linkUrl]=" '' " />
<h1 pdk-typography="heading-xlarge" class="mb-l">
  {{ 'HEARING_RESULTS' | translate | capitalize }}
</h1>
<pdk-grid container>
  <pdk-grid one-third class="side-bar">
    <defendant-details [defendant]="selectedDefendantDetails$ | async" />
    <hr pdk-margin-bottom="1" />
    <hearing-details
      [hearing]="(selectedHearingDetails$ | async)?.hearing"
      [sharedTime]="(selectedHearingDetails$ | async)?.sharedTime"
    />
    <hr pdk-margin-bottom="1" />
  </pdk-grid>
  <pdk-grid two-thirds>
    <results-details
      [prosecutionCases]="(selectedHearingDetails$ | async)?.hearing?.prosecutionCases"
    />
    <document-variants
      (downloadDocument)="downloadDocument($event)"
      [documentIndices]="documents$ | async"
    />
  </pdk-grid>
</pdk-grid>
