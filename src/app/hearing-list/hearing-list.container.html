<div pdk-container pdk-margin-top="6" pdk-margin-bottom="6">
  <h1 pdk-typography="heading-xlarge">{{'AVAILABLE_HEARING_RESULTS' | translate}}</h1>
  <pdk-grid container>
    <pdk-grid one-third>
      <hearing-results-filter
        [dateOptions]="dateOptions"
        [courtCentres]="courtCentres$ | async"
        (filterChange)="controlsChanged($event)"
      ></hearing-results-filter>
    </pdk-grid>
    <pdk-grid two-thirds>
      <hearing-results
        [hearings]="hearings$"
        (resultClick)="goToHearingResult($event)"
      ></hearing-results>
    </pdk-grid>
  </pdk-grid>
</div>
